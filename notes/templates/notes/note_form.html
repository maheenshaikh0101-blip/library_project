{% extends 'base.html' %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
<div class="form-card">
    <h1>{{ heading }}</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">Save</button>
            <a class="btn btn-ghost" href="{% url 'note_list' %}">Back to My Notes</a>
        </div>
    </form>
</div>
{% endblock %}
